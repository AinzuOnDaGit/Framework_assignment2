{% extends "base.html" %}

{% block title %} CCCU Blog {% endblock %}

{% block content %}


<h2>Welcome to the blog</h2>
<div class="card shadow p-4 rounded-2">
<table class="table table-striped table-bordered table-hover">
    <caption class="text-muted"> Recent Posts</caption>

    <thead class="table-light"></thead>
        <tr>
            <th scope="col"> Title </th>
            <th scope="col"> Description</th>
            <th scope="col"> Image</th>
        </tr>
    </thead>
    <tbody>
        {% for post in posts %}
        <tr>
            <td> {{ post.title }}</td>
            <td> {{ post.description }}</td>
            <td>
                {% if post.image_filename %}
                    <img src="{{ url_for('static', filename='uploads/' ~ post.image_filename) }}"
                    style="max-width: 300px; height: auto; border-radius: 5px;">
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
